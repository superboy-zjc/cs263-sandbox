[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs263-sandbox"
version = "0.1.0"
description = "A small interpreter and isolated comparison harness for CS263."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.1"]

[project.scripts]
cs263-sandbox = "sandbox.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox*"]
exclude = ["tests*"]
namespaces = false

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
lines-after-imports = 2
